# TradePy Configuration Settings
initial_capital: 10000

trading:
  use_mt5: true
  dry_run: false
  timeframe: 5
  poll_seconds: 5

risk:
  max_daily_loss_pct: 0.03
  max_consecutive_losses: 3
  max_trades_per_day: 10
  max_open_trades_per_symbol: 1
  max_global_open_positions: 2
  cooldown_minutes_after_loss: 45
  max_spread_points: 35
  max_slippage_points: 35
  one_trade_per_symbol_per_day: false
  cooldown_minutes_after_trade_per_symbol: 240
  daily_profit_target_usd: 8
  profit_lock_mode: "cooldown_hours"
  profit_lock_hours: 6
  trading_timezone: "Africa/Douala"
  daily_reset_hour: 0
  state_path: "runtime/state.json"

  max_spread_points_by_symbol:
    BTCUSDm: 80
    XAUUSDm: 60
  
  max_slippage_points_by_symbol:
    BTCUSDm: 80
    XAUUSDm: 60

  position_sizing:
    defaults:
      base_lot: 0.01
    per_symbol:
      BTCUSDm:
        multiplier: 1.5
      XAUUSDm:
        multiplier: 1.3
    max_lot: 0.05