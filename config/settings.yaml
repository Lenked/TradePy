# TradePy Configuration Settings
initial_capital: 10000

trading:
  use_mt5: true
  dry_run: false
  timeframe: 5
  timeframes: [5, 15, 60]
  preferred_timeframe: 15
  poll_seconds: 5
  min_order_interval_seconds: 1

strategy:
  # SL/TP ATR: TP élargi pour viser des gains de $10+ avant de sécuriser
  sl_atr_multiplier: 2.2
  tp_atr_multiplier: 4.5
  ema_short_period: 50
  ema_long_period: 200
  rsi_period: 14
  atr_period: 14
  ai_decision:
    enabled: true
    allow_ai_override: false
    buy_threshold: 0.55
    sell_threshold: 0.55
    override_threshold: 0.70
    min_signal_gap: 0.06
    base_signal_bonus: 0.10
    conflict_penalty: 0.08
    volatility_target: 0.01
    weights:
      trend: 0.35
      momentum: 0.25
      alignment: 0.20
      breakout: 0.20
      volatility: 0.10
  decision_guard:
    enabled: true
    mode: enforce
    target: label_big_loss
    model_path: "artifacts/models/dashboard_decision_model_bundle.joblib"
    seed_dashboard_path: "data/dashboard.json"
    block_threshold: 0.75
    throttle_threshold: 0.60
    throttle_factor: 0.70
    snapshots_path: "runtime/ai_signal_snapshots.jsonl"
  # RSI: élargi pour ne pas filtrer trop de signaux valides
  rsi_buy_max: 75
  rsi_sell_min: 25
  sl_tp_overrides_by_symbol:
    USOILm:
      sl_atr: 1.8
      tp_atr: 4.0
    XAUUSDm:
      sl_atr: 2.5
      tp_atr: 5.0
    BTCUSDm:
      sl_atr: 2.3
      tp_atr: 4.5
  scalping:
    enabled: true
    min_reward_risk_ratio: 1.20
    # Ne pas sécuriser trop tôt — laisser le trade courir vers $10+
    break_even_trigger_pct: 0.65
    break_even_offset_usd: 0.50
    secure_profit_trigger_pct: 0.85
    secure_profit_lock_pct: 0.75
    trailing_stop_enabled: true
    trailing_stop_activation_pct: 0.70
    trailing_stop_distance_atr_multiplier: 1.50
    fast_exit_on_reversal: false
    reversal_candles_required: 3
    symbol_overrides:
      BTCUSDm:
        min_reward_risk_ratio: 1.20
        tp_multiplier: 2.50
        trailing_stop_distance_atr_multiplier: 1.60
      XAUUSDm:
        min_reward_risk_ratio: 1.20
        tp_multiplier: 3.50
        trailing_stop_distance_atr_multiplier: 1.50
      USOILm:
        min_reward_risk_ratio: 1.20
        tp_multiplier: 3.00
        trailing_stop_distance_atr_multiplier: 1.40
  intra_bar_trading:
    enabled: true
    max_trades_per_bar: 1
    min_seconds_between_trades: 20
    allow_reentry_same_direction: false
    allow_reentry_after_tp: true
    allow_reverse_trade_same_bar: false
    require_price_move_pct_between_entries: 0.15
    require_new_high_low_breakout: true
    cooldown_after_loss_seconds: 120
    symbol_overrides:
      BTCUSDm:
        max_trades_per_bar: 1
        min_seconds_between_trades: 25
      XAUUSDm:
        max_trades_per_bar: 1
        min_seconds_between_trades: 25
      USOILm:
        max_trades_per_bar: 1
        min_seconds_between_trades: 35

risk:
  max_daily_loss_pct: 0.03
  max_daily_loss_usd: 40
  max_consecutive_losses: 5
  max_trades_per_day: 15
  max_trades_per_day_by_symbol:
    BTCUSDm: 5
    XAUUSDm: 4
    USOILm: 3
    EURUSDm: 3
    NVDAm: 2
  max_open_trades_per_symbol: 1
  max_global_open_positions: 3
  cooldown_minutes_after_loss: 10
  global_cooldown_minutes_after_loss: 5
  one_trade_per_symbol_per_day: false
  cooldown_minutes_after_trade_per_symbol: 0
  daily_profit_target_usd: 0
  profit_lock_mode: "cooldown_hours"
  profit_lock_hours: 6
  trading_timezone: "Africa/Douala"
  daily_reset_hour: 0
  trading_session:
    enabled: true
    start_hour: 15
    start_minute: 0
    end_hour: 7
    end_minute: 0
  trading_session_by_symbol:
    BTCUSDm:
      enabled: true
      start_hour: 0
      start_minute: 0
      end_hour: 0
      end_minute: 0
    XAUUSDm:
      enabled: true
      start_hour: 15
      start_minute: 0
      end_hour: 23
      end_minute: 30
    USOILm:
      enabled: true
      start_hour: 15
      start_minute: 0
      end_hour: 22
      end_minute: 30
    EURUSDm:
      enabled: true
      start_hour: 15
      start_minute: 0
      end_hour: 23
      end_minute: 30
    NVDAm:
      enabled: true
      start_hour: 15
      start_minute: 30
      end_hour: 22
      end_minute: 0
  state_path: "runtime/state.json"

  max_spread_points: 50
  max_slippage_points: 50

  max_spread_points_by_symbol:
    BTCUSDm: 3000
    XAUUSDm: 1200
    USOILm: 150
    EURUSDm: 30
    NVDAm: 50

  max_slippage_points_by_symbol:
    BTCUSDm: 25000
    XAUUSDm: 1500
    USOILm: 200
    EURUSDm: 40
    NVDAm: 60

  cooldown_overrides_by_symbol:
    BTCUSDm: 3
    XAUUSDm: 8
    USOILm: 10
    EURUSDm: 5
    NVDAm: 10

  symbol_daily_loss_limit_usd_by_symbol:
    BTCUSDm: 15
    XAUUSDm: 12
    USOILm: 8
    EURUSDm: 6
    NVDAm: 6

  max_open_trades_per_symbol_by_symbol:
    BTCUSDm: 1
    XAUUSDm: 1
    USOILm: 1
    EURUSDm: 1
    NVDAm: 1

  cooldown_after_trade_overrides_by_symbol:
    BTCUSDm: 0
    XAUUSDm: 5
    USOILm: 10
    EURUSDm: 5
    NVDAm: 15

  position_sizing:
    defaults:
      base_lot: 0.01
      min_lot: 0.01
      lot_step: 0.01
      risk_per_trade_pct: 0.01
      confidence_floor: 0.85
      confidence_ceiling: 1.20
      soft_max_sl_distance_pct: 0.015
      soft_max_tp_distance_pct: 0.03
      hard_max_sl_distance_pct: 0.04
      hard_max_tp_distance_pct: 0.08
      wide_distance_min_factor: 0.40
    per_symbol:
      BTCUSDm:
        multiplier: 1.3
        risk_per_trade_pct: 0.008
      XAUUSDm:
        multiplier: 1.2
        risk_per_trade_pct: 0.008
      USOILm:
        multiplier: 1.0
        risk_per_trade_pct: 0.007
      EURUSDm:
        multiplier: 1.0
        risk_per_trade_pct: 0.008
      NVDAm:
        multiplier: 0.8
        risk_per_trade_pct: 0.006
    max_lot: 0.20

# USOILm reste désactivé — perte de -$158, à réactiver après analyse
symbols_disabled:
  - USOILm

symbol_schedule:
  # Samedi — BTC trade 24/7
  5: ["BTCUSDm"]
  # Dimanche — BTC trade 24/7
  6: ["BTCUSDm"]
