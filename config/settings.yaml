# TradePy Configuration Settings
initial_capital: 10000

trading:
  use_mt5: true
  dry_run: false
  timeframe: 5
  # Multi-timeframe scan (minutes). If defined, it overrides `timeframe`.
  timeframes: [15, 60]
  # Conflict resolution: prefer this timeframe if signals disagree
  preferred_timeframe: 60
  poll_seconds: 10

strategy:
  # Default ATR multiples for SL/TP (réduire les sorties en SL = donner plus de marge)
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 3.0
  # Filtres RSI: éviter entrées en surachat/survente (optionnel)
  rsi_buy_max: 70    # BUY seulement si RSI < 70
  rsi_sell_min: 30   # SELL seulement si RSI > 30
  # Monter progressivement la taille et accepter des trades un peu plus "lents"
  risk_per_trade_pct: 0.015
  volume_aggressiveness: 1.4
  max_base_volume: 0.20
  # Overrides SL/TP par symbole (volatilité différente)
  sl_tp_overrides_by_symbol:
    # USOIL: élargi (avant 0.6/0.9 = trop serré → trop de SL)
    USOILm:
      sl_atr: 1.5
      tp_atr: 2.5
    # XAU: SL un peu plus large pour absorber les spikes, TP plus haut pour le R:R
    XAUUSDm:
      sl_atr: 2.5
      tp_atr: 3.5

risk:
  max_daily_loss_pct: 0.03
  max_consecutive_losses: 3
  max_trades_per_day: 8
  # Per-symbol daily trade limits
  max_trades_per_day_by_symbol:
    BTCUSDm: 2
    XAUUSDm: 2
    USOILm: 2
  max_open_trades_per_symbol: 1
  max_global_open_positions: 5
  cooldown_minutes_after_loss: 30          # base for all symbols
  global_cooldown_minutes_after_loss: 8    # small global freeze to prevent spirals
  one_trade_per_symbol_per_day: false
  cooldown_minutes_after_trade_per_symbol: 180
  # Disable daily profit lock for now (set to >0 to re-enable)
  daily_profit_target_usd: 0
  profit_lock_mode: "cooldown_hours"
  profit_lock_hours: 6
  trading_timezone: "Africa/Douala"
  daily_reset_hour: 0
  state_path: "runtime/state.json"

  max_spread_points: 35
  max_slippage_points: 35

  max_spread_points_by_symbol:
    BTCUSDm: 2500
    XAUUSDm: 1000
    USOILm: 120
  
  max_slippage_points_by_symbol:
    BTCUSDm: 20000
    XAUUSDm: 1200
    USOILm: 150

  cooldown_overrides_by_symbol:
    BTCUSDm: 5
    XAUUSDm: 10
    USOILm: 10

  # Hard stop by symbol if realized PnL for the trading day drops below -limit
  symbol_daily_loss_limit_usd_by_symbol:
    XAUUSDm: 20

  # Temporary safe mode by symbol (date inclusive, YYYY-MM-DD)
  symbol_safe_mode_by_symbol:
    XAUUSDm:
      enabled_until: "2026-03-10"
      max_trades_per_day: 2
      cooldown_after_trade_minutes: 120
      cooldown_after_loss_minutes: 120
      volume_multiplier: 0.5
      daily_loss_limit_usd: 20

  # Symbol-specific risk overrides
  max_open_trades_per_symbol_by_symbol:
    BTCUSDm: 1
    XAUUSDm: 1
    USOILm: 1

  cooldown_after_trade_overrides_by_symbol:
    BTCUSDm: 120
    XAUUSDm: 180
    USOILm: 180

  position_sizing:
    defaults:
      base_lot: 0.01
    per_symbol:
      BTCUSDm:
        multiplier: 2.0
      XAUUSDm:
        multiplier: 1.8
    max_lot: 0.12

# Symboles à exclure du trading (ex: USOILm très perdant sur l'historique)
# Décommenter pour désactiver temporairement un symbole
# symbols_disabled:
#   - USOILm

symbol_schedule:
  # Saturday
  5: ["XAUUSDm"]
  # Sunday
  6: ["XAUUSDm"]
