# TradePy Configuration Settings
initial_capital: 10000

trading:
  use_mt5: true
  dry_run: false
  timeframe: 5
  # Multi-timeframe scan (minutes). If defined, it overrides `timeframe`.
  timeframes: [5, 15, 60]
  # Conflict resolution: prefer this timeframe if signals disagree
  preferred_timeframe: 15
  poll_seconds: 5
  min_order_interval_seconds: 1

strategy:
  # Default ATR multiples for SL/TP (réduire les sorties en SL = donner plus de marge)
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 3.0
  ai_decision:
    enabled: true
    allow_ai_override: false
    buy_threshold: 0.62
    sell_threshold: 0.62
    override_threshold: 0.70
    min_signal_gap: 0.08
    base_signal_bonus: 0.08
    conflict_penalty: 0.10
    volatility_target: 0.01
    weights:
      trend: 0.35
      momentum: 0.25
      alignment: 0.20
      breakout: 0.20
      volatility: 0.15
  decision_guard:
    enabled: true
    mode: shadow
    target: label_big_loss
    model_path: "artifacts/models/dashboard_decision_model_bundle.joblib"
    seed_dashboard_path: "data/dashboard.json"
    block_threshold: 0.68
    throttle_threshold: 0.55
    throttle_factor: 0.65
    snapshots_path: "runtime/ai_signal_snapshots.jsonl"
  # Filtres RSI: éviter entrées en surachat/survente (optionnel)
  rsi_buy_max: 70    # BUY seulement si RSI < 70
  rsi_sell_min: 30   # SELL seulement si RSI > 30
  # Overrides SL/TP par symbole (volatilité différente)
  sl_tp_overrides_by_symbol:
    # USOIL: élargi (avant 0.6/0.9 = trop serré → trop de SL)
    USOILm:
      sl_atr: 1.5
      tp_atr: 2.5
    # XAU: SL un peu plus large pour absorber les spikes, TP plus haut pour le R:R
    XAUUSDm:
      sl_atr: 2.5
      tp_atr: 3.5
  scalping:
    enabled: true
    min_reward_risk_ratio: 1.00
    break_even_trigger_pct: 0.35
    break_even_offset_usd: 0.15
    secure_profit_trigger_pct: 0.75
    secure_profit_lock_pct: 0.55
    trailing_stop_enabled: true
    trailing_stop_activation_pct: 0.55
    trailing_stop_distance_atr_multiplier: 0.80
    fast_exit_on_reversal: true
    reversal_candles_required: 1
    symbol_overrides:
      BTCUSDm:
        min_reward_risk_ratio: 1.10
        tp_multiplier: 2.20
        trailing_stop_distance_atr_multiplier: 0.75
      XAUUSDm:
        min_reward_risk_ratio: 1.10
        tp_multiplier: 3.00
        trailing_stop_distance_atr_multiplier: 0.90
      USOILm:
        min_reward_risk_ratio: 1.10
        tp_multiplier: 2.00
        trailing_stop_distance_atr_multiplier: 0.85
  intra_bar_trading:
    enabled: true
    max_trades_per_bar: 1
    min_seconds_between_trades: 20
    allow_reentry_same_direction: false
    allow_reentry_after_tp: false
    allow_reverse_trade_same_bar: false
    require_price_move_pct_between_entries: 0.18
    require_new_high_low_breakout: true
    cooldown_after_loss_seconds: 180
    symbol_overrides:
      BTCUSDm:
        max_trades_per_bar: 1
        min_seconds_between_trades: 30
      XAUUSDm:
        max_trades_per_bar: 1
        min_seconds_between_trades: 30
      USOILm:
        max_trades_per_bar: 1
        min_seconds_between_trades: 45

risk:
  max_daily_loss_pct: 0.02
  max_daily_loss_usd: 60
  max_consecutive_losses: 2
  max_trades_per_day: 8
  # Per-symbol daily trade limits
  max_trades_per_day_by_symbol:
    BTCUSDm: 3
    XAUUSDm: 2
    USOILm: 2
    EURUSDm: 2
    NVDAm: 1
  max_open_trades_per_symbol: 1
  max_global_open_positions: 2
  cooldown_minutes_after_loss: 30          # base for all symbols
  global_cooldown_minutes_after_loss: 15   # small global freeze to prevent spirals
  one_trade_per_symbol_per_day: false
  cooldown_minutes_after_trade_per_symbol: 0
  # Disable daily profit lock for now (set to >0 to re-enable)
  daily_profit_target_usd: 0
  profit_lock_mode: "cooldown_hours"
  profit_lock_hours: 6
  trading_timezone: "Africa/Douala"
  daily_reset_hour: 0
  trading_session:
    enabled: true
    start_hour: 16
    start_minute: 0
    end_hour: 6
    end_minute: 0
  trading_session_by_symbol:
    BTCUSDm:
      enabled: true
      start_hour: 16
      start_minute: 0
      end_hour: 6
      end_minute: 0
    XAUUSDm:
      enabled: true
      start_hour: 16
      start_minute: 0
      end_hour: 23
      end_minute: 0
    USOILm:
      enabled: true
      start_hour: 16
      start_minute: 0
      end_hour: 22
      end_minute: 0
    EURUSDm:
      enabled: true
      start_hour: 16
      start_minute: 0
      end_hour: 23
      end_minute: 0
    NVDAm:
      enabled: true
      start_hour: 16
      start_minute: 0
      end_hour: 22
      end_minute: 0
  state_path: "runtime/state.json"

  max_spread_points: 35
  max_slippage_points: 35

  max_spread_points_by_symbol:
    BTCUSDm: 2500
    XAUUSDm: 1000
    USOILm: 120
  
  max_slippage_points_by_symbol:
    BTCUSDm: 20000
    XAUUSDm: 1200
    USOILm: 150

  cooldown_overrides_by_symbol:
    BTCUSDm: 5
    XAUUSDm: 15
    USOILm: 20
    EURUSDm: 10
    NVDAm: 15

  # Hard stop by symbol if realized PnL for the trading day drops below -limit
  symbol_daily_loss_limit_usd_by_symbol:
    BTCUSDm: 20
    XAUUSDm: 15
    USOILm: 10
    EURUSDm: 8
    NVDAm: 8

  # Symbol-specific risk overrides
  max_open_trades_per_symbol_by_symbol:
    BTCUSDm: 1
    XAUUSDm: 1
    USOILm: 1
    EURUSDm: 1
    NVDAm: 1

  cooldown_after_trade_overrides_by_symbol:
    BTCUSDm: 0
    XAUUSDm: 15
    USOILm: 20
    EURUSDm: 10
    NVDAm: 30

  position_sizing:
    defaults:
      base_lot: 0.01
      min_lot: 0.01
      lot_step: 0.01
      risk_per_trade_pct: 0.01
      confidence_floor: 0.80
      confidence_ceiling: 1.25
      soft_max_sl_distance_pct: 0.01
      soft_max_tp_distance_pct: 0.02
      hard_max_sl_distance_pct: 0.03
      hard_max_tp_distance_pct: 0.06
      wide_distance_min_factor: 0.35
    per_symbol:
      BTCUSDm:
        multiplier: 1.5
        risk_per_trade_pct: 0.008
      XAUUSDm:
        multiplier: 1.3
        risk_per_trade_pct: 0.009
      USOILm:
        multiplier: 1.1
        risk_per_trade_pct: 0.008
    max_lot: 0.30

# Symboles à exclure du trading (ex: USOILm très perdant sur l'historique)
# Décommenter pour désactiver temporairement un symbole
# USOILm is intentionally disabled for now.
symbols_disabled:
  - USOILm

symbol_schedule:
  # Saturday
  5: ["XAUUSDm"]
  # Sunday
  6: ["XAUUSDm"]
